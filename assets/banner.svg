<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Fuad Alekperov: builds things that run on phones, servers and in games">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#bc8cff"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#30363d" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect y="292" width="1200" height="8" fill="url(#accent)"/>

  <g font-family="'SF Pro Display','Segoe UI',Helvetica,Arial,sans-serif">
    <text x="80" y="128" font-size="66" font-weight="700" fill="#f0f6fc">Fuad Alekperov</text>
    <text x="80" y="178" font-size="26" fill="#8b949e">I build things that run on phones, servers and in games.</text>

    <g font-size="18" font-weight="600" text-anchor="middle">
      <rect x="80" y="212" width="200" height="40" rx="20" fill="#1f6feb" fill-opacity="0.18" stroke="#58a6ff" stroke-opacity="0.6"/>
      <text x="180" y="238" fill="#79c0ff">Android · LineageOS</text>

      <rect x="296" y="212" width="130" height="40" rx="20" fill="#8957e5" fill-opacity="0.18" stroke="#bc8cff" stroke-opacity="0.6"/>
      <text x="361" y="238" fill="#d2a8ff">Security</text>

      <rect x="442" y="212" width="160" height="40" rx="20" fill="#238636" fill-opacity="0.18" stroke="#3fb950" stroke-opacity="0.6"/>
      <text x="522" y="238" fill="#7ee787">Self-hosting</text>

      <rect x="618" y="212" width="170" height="40" rx="20" fill="#bf8700" fill-opacity="0.18" stroke="#d29922" stroke-opacity="0.6"/>
      <text x="703" y="238" fill="#e3b341">Games · Unity</text>
    </g>
  </g>
</svg>
